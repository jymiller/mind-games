# Render Blueprint — the Deal Memory web service AND its Postgres database.
#
# Dashboard → New → Blueprint → connect jymiller/mind-games → Render reads this file → Apply.
# Applying it creates both, and injects the database connection string into the service, so
# no database credential is ever typed, stored in git, or pasted into a dashboard.
#
# The `sync: false` keys are the only ones Render prompts for. Nothing secret lives here.
databases:
  - name: deal-memory-db
    databaseName: deal_memory
    user: deal_memory
    plan: free # NOTE: Render expires free Postgres instances after 30 days. Upgrade before then.
    region: oregon

services:
  - type: web
    name: deal-memory
    runtime: node
    plan: free # upgrade to "starter" in the dashboard for the live demo (no cold starts)
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Postgres — the SOURCE OF TRUTH. Render injects this; it is never entered by hand.
      # Memory holds a derived copy, and the gap between them is what we measure.
      - key: DATABASE_URL
        fromDatabase:
          name: deal-memory-db
          property: connectionString
      # XTrace Memory — the derived copy (covenants, revisions, recall).
      - key: XTRACE_API_KEY
        sync: false
      # Novita — inference for the ablation (scene 6) and free-text recall (scene 8).
      - key: NOVITA_API_KEY
        sync: false
      - key: NOVITA_MODEL
        sync: false
      # Scope names — NOT secrets. They keep dev memory out of covenant recall.
      - key: XTRACE_DOMAIN_APP_ID
        value: deal-memory
      - key: XTRACE_DEV_USER_ID
        value: mg-build
      - key: XTRACE_DEV_APP_ID
        value: mind-games-build
      - key: XTRACE_DEV_NAMESPACE
        value: repo:mind-games
      - key: NODE_VERSION
        value: "22"
